[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "icx-engine"
version = "0.3.9"
description = "ICX: Integrated Contextual X-ecution Engine - AI-native intelligence layer for development teams. Deep context extraction, local-first RAG memory, multi-modal analysis, and codebase knowledge graph. Securely bridge your work tracker to your AI agents via MCP."
readme = "readme.md"
license = { file = "license" }
authors = [
    { name = "althaf", email = "althaf.space@gmail.com" }
]
requires-python = ">=3.11, <3.15"
keywords = ["ai", "context", "mcp", "cli", "llm", "developer-tools", "memory", "jira", "knowledge-graph", "codebase-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "shellingham>=1.5",
    "pydantic>=2.0",
    "httpx>=0.27",
    "openai>=1.0",
    "anthropic>=0.30",
    "mcp>=1.0",
    "keyring>=24.0",
    "cryptography>=41.0",
    "tomli_w>=1.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "openpyxl>=3.1",
    "pdfminer.six>=20221105",
    "python-docx>=1.1",
    "google-genai>=1.0",
    "lancedb>=0.15",
    "networkx>=3.0",
    "datasketch>=1.6",
    "rapidfuzz>=3.0",
    "tree-sitter>=0.23",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-java",
    "psutil>=5.9",
    "filelock>=3.12",
    "jedi>=0.19",
    "javalang>=0.13",
    "numpy>=1.24",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "faster-whisper>=1.0",
    "imageio-ffmpeg>=0.5",
    "tiktoken>=0.5",
    "xlrd>=2.0",
    "python-pptx>=1.0",
    "pymupdf>=1.24",
]

[project.urls]
Homepage = "https://github.com/althaf-space/icx-engine"
Repository = "https://github.com/althaf-space/icx-engine"
"Bug Tracker" = "https://github.com/althaf-space/icx-engine/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]
graph-extended = [
    "tree-sitter-go",
    "tree-sitter-c-sharp",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-swift",
    "tree-sitter-php",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-scala",
    "tree-sitter-dart",
    "tree-sitter-elixir",
]

[project.scripts]
icx = "icx_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/icx_engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
norecursedirs = ["tests/graph/eval/fixtures"]
filterwarnings = [
    # google-genai uses a private typing internal deprecated in Python 3.14.
    # Affects tests on 3.14; removal is Python 3.17 (outside our <3.15 range).
    "ignore:.*_UnionGenericAlias.*:DeprecationWarning:google",
    # Python 3.14 + pytest-asyncio interaction: sync tests that call asyncio.run()
    # leave GC-cleanup coroutines of engine.run that are finalized during later test
    # class/model setup. The test itself passes; this is a GC timing artifact only.
    "ignore:coroutine 'run' was never awaited:RuntimeWarning",
]
