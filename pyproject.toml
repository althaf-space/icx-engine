[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "icx-engine"
version = "0.3.3"
description = "ICX: Integrated Contextual X-ecution Engine - AI-native intelligence layer for development teams. Deep context extraction, local-first RAG memory, multi-modal analysis, and codebase knowledge graph. Securely bridge your work tracker to your AI agents via MCP."
readme = "readme.md"
license = { file = "license" }
authors = [
    { name = "althaf", email = "althaf.space@gmail.com" }
]
requires-python = ">=3.11, <3.15"
keywords = ["ai", "context", "mcp", "cli", "llm", "developer-tools", "memory", "jira", "knowledge-graph", "codebase-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "shellingham>=1.5",
    "pydantic>=2.0",
    "httpx>=0.27",
    "openai>=1.0",
    "anthropic>=0.30",
    "mcp>=1.0",
    "keyring>=24.0",
    "cryptography>=41.0",
    "tomli_w>=1.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "openpyxl>=3.1",
    "pdfminer.six>=20221105",
    "python-docx>=1.1",
    "google-genai>=1.0",
    "graphifyy>=0.1.14",
    "lancedb>=0.15",
    "numpy>=1.24",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
]

[project.urls]
Homepage = "https://github.com/althaf-space/icx-engine"
Repository = "https://github.com/althaf-space/icx-engine"
"Bug Tracker" = "https://github.com/althaf-space/icx-engine/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
icx = "icx_engine.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/icx_engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
