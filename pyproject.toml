[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "icx-engine"
version = "0.4.3"
description = "ICX (Integrated Contextual X-ecution Engine): an AI-native intelligence layer for development teams. Extracts deep issue context from work trackers, processes attachments including images, documents, audio and video, runs multi-provider LLM analysis, maintains a local-first RAG memory, builds a multi-language codebase knowledge graph, reads SonarQube code-quality findings, and drives AI-assisted testing. Exposes everything to AI editors over MCP and the CLI."
readme = "readme.md"
license = { file = "license" }
authors = [
    { name = "althaf", email = "althaf.space@gmail.com" }
]
requires-python = ">=3.11, <3.15"
keywords = [
    "ai", "llm", "mcp", "cli", "developer-tools", "context-engineering",
    "rag", "embeddings", "vector-search", "knowledge-graph", "code-graph",
    "static-analysis", "code-intelligence", "codebase-analysis", "jira",
    "sonarqube", "code-quality", "software-testing", "multimodal",
    "transcription", "ocr", "memory",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "shellingham>=1.5",
    "pydantic>=2.0",
    "httpx>=0.27",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "aiosqlite>=0.20",
    "openai>=1.0",
    "anthropic>=0.30",
    "mcp>=1.0",
    "keyring>=24.0",
    "cryptography>=41.0",
    "tomli_w>=1.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "openpyxl>=3.1",
    "pdfminer.six>=20221105",
    "python-docx>=1.1",
    "google-genai>=1.0",
    "lancedb>=0.15",
    "networkx>=3.0",
    "datasketch>=1.6",
    "rapidfuzz>=3.0",
    "tree-sitter>=0.23",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-java",
    "psutil>=5.9",
    "filelock>=3.12",
    "jedi>=0.19",
    "javalang>=0.13",
    "numpy>=1.24",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "faster-whisper>=1.0",
    "imageio-ffmpeg>=0.5",
    "tiktoken>=0.5",
    "xlrd>=2.0",
    "python-pptx>=1.0",
    "pymupdf>=1.24",
    "defusedxml>=0.7",
]

[project.urls]
Homepage = "https://github.com/althaf-space/icx-engine"
Repository = "https://github.com/althaf-space/icx-engine"
"Bug Tracker" = "https://github.com/althaf-space/icx-engine/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]
graph-extended = [
    "tree-sitter-go",
    "tree-sitter-c-sharp",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-swift",
    "tree-sitter-php",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-scala",
    "tree-sitter-dart",
    "tree-sitter-elixir",
]

[project.scripts]
icx = "icx_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/icx_engine"]

[tool.hatch.build.targets.wheel.force-include]
"src/icx_engine/py.typed" = "icx_engine/py.typed"
"src/icx_engine/testing/runners/assets/icx-auth.mjs" = "icx_engine/testing/runners/assets/icx-auth.mjs"
"src/icx_engine/testing/runners/assets/icx-discover.mjs" = "icx_engine/testing/runners/assets/icx-discover.mjs"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
norecursedirs = ["tests/graph/eval/fixtures"]
filterwarnings = [
    # google-genai uses a private typing internal deprecated in Python 3.14.
    # Affects tests on 3.14; removal is Python 3.17 (outside our <3.15 range).
    "ignore:.*_UnionGenericAlias.*:DeprecationWarning:google",
    # Python 3.14 + pytest-asyncio interaction: sync tests that call asyncio.run()
    # leave GC-cleanup coroutines of engine.run that are finalized during later test
    # class/model setup. The test itself passes; this is a GC timing artifact only.
    "ignore:coroutine 'run' was never awaited:RuntimeWarning",
    # TestingState TypedDict name starts with "Test" - pytest false-positive collection attempt.
    "ignore::pytest.PytestCollectionWarning",
    # langchain-core Pydantic V1 shim not compatible with Python 3.14 - transitive dep of langgraph.
    "ignore:Core Pydantic V1 functionality.*:UserWarning:langchain_core",
]
